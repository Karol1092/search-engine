<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
        <title>Search</title>
    </head>

    <body>
        <h1 class="logo">
            <span class="blue">S</span>
            <span class="red">e</span>
            <span class="yellow">a</span>
            <span class="blue">r</span>
            <span class="green">c</span>
            <span class="red">h</span>
        </h1>
        
        <div class="search-box">
            <input id="input" placeholder="search">
            <button onclick="searchResults()">Search</button>
        </div>

        <hr>

        <ul id="results"></ul>

    </body>
    

    <script>
        const API = "http://127.0.0.1:8000";

        async function searchResults() {
            const inputText = document.getElementById("input").value;

            const res = await fetch(`${API}/search`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text: inputText })
            });

            const data = await res.json();

            const list = document.getElementById("results");
            list.innerHTML = "";

            data.results.forEach(result => {
                const li = document.createElement("li");

                let scoreClass = "";

                if (result.score >= 70) scoreClass = "good";
                else if (result.score >= 40) scoreClass = "medium";
                else scoreClass = "bad";

                li.innerHTML = `
                    <div class="results">
                        <p class="title">${result.title}</p>
                        <a class="link" href="${result.url}" target="_blank">${result.url}</a>
                        <p class="score ${scoreClass}" >${result.score}%</p>
                    </div>
                `;

                list.append(li);
            });
        }

    </script>

</html>
